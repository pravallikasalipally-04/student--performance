{% extends "base.html" %}
{% block content %}<h2>{{ "Edit" if grade else "Assign" }} Grade</h2>
<form method="post" action="{{ url_for('grades.grade_detail', id=grade.id) if grade else url_for('grades.grades_collection') }}" class="col-md-6">
{% if grade %}<input type="hidden" name="_method" value="PUT">{% endif %}
{% if not grade %}<select class="form-select mb-2" name="student_id" required>{% for s in students %}<option value="{{ s.id }}">{{ s.id }} - {{ s.name }}</option>{% endfor %}</select>
<select class="form-select mb-2" name="course_id" required>{% for c in courses %}<option value="{{ c.id }}">{{ c.code }} - {{ c.name }}</option>{% endfor %}</select>{% endif %}
<input class="form-control mb-2" name="score" type="number" step="0.01" min="0" max="100" value="{{ grade.score if grade else '' }}" placeholder="Score" required>
<input class="form-control mb-2" name="date" type="date" value="{{ grade.date if grade else '' }}">
<button class="btn btn-primary">Save</button></form>{% endblock %}
