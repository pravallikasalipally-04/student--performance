<!doctype html>
<html>
<head>
    <title>{% block title %}Student Analytics{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark navbar-expand-lg">
<div class="container">
<a class="navbar-brand" href="{{ url_for('index') }}">Student Analytics</a>
<div>
<a class="btn btn-sm btn-outline-light" href="{{ url_for('dashboard') }}">Dashboard</a>
<a class="btn btn-sm btn-outline-light" href="{{ url_for('students.students_collection') }}">Students</a>
<a class="btn btn-sm btn-outline-light" href="{{ url_for('courses.courses_collection') }}">Courses</a>
<a class="btn btn-sm btn-outline-light" href="{{ url_for('grades.grades_collection') }}">Grades</a>
<a class="btn btn-sm btn-outline-light" href="{{ url_for('analytics.analytics') }}">Analytics</a>
<a class="btn btn-sm btn-warning" href="{{ url_for('auth.logout') }}">Logout</a>
</div>
</div>
</nav>
<div class="container py-4">
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="alert alert-{{ category }}">{{ message }}</div>
{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</div>
</body>
</html>
